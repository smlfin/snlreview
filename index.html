<!DOCTYPE html>
<html lang="en">
<head>
  <title>Branch Review Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ━━━ TOPBAR ━━━ -->
<div class="topbar">
  <h1>Branch Review Dashboard</h1>
  <button class="tb-hamburger" id="tbHamburger" onclick="toggleTopbarMenu()" aria-label="Menu">☰</button>
  <div class="topbar-controls" id="topbarControls">
    <a class='nav-link' href='/staff_dashboard'>Staff Productivity</a>
    <span id="adminReportLink" style="display:none">
      <a class='nav-link admin-link' href='/admin_report'>📋 Admin Report</a>
      <a href="#" onclick="openSNLReview();return false;" class="nav-link admin-link">🏢 SNL Review</a>
    </span>
    <select id="branchSel" onchange="onBranch();closeTopbarMenu()" style="display:none"></select>
    <select id="modeSel" onchange="onMode();closeTopbarMenu()">
      <option value="all">All staff</option>
      <option value="single">Individual</option>
    </select>
    <select id="staffSel" style="display:none" onchange="render();closeTopbarMenu()"></select>
    <span id="userInfo"></span>
    <button class="tb-btn" onclick="openProfilePicker();closeTopbarMenu()">👤 Employee Profile</button>
    <button class="tb-btn" id="reviewChecklistBtn" style="display:none" onclick="openReviewChecklist();closeTopbarMenu()">📝 Review Checklist</button>
    <button class="tb-btn" onclick="doExport();closeTopbarMenu()">↓ Export</button>
    <a class="tb-btn" href="presentation.html" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">🖥️ Presentation Mode</a>
    <button class="tb-btn danger" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="main" id="mainArea">
  <div class="spinner" id="loader">⏳ Connecting to Google Sheets…</div>
</div>

<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Details</h3>
      <button class="mclose" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ━━━ EMPLOYEE PROFILE — dedicated overlay, independent of the modal above ━━━ -->
<div class="overlay" id="profOverlay" onclick="maybeCloseProfile(event)">
  <div class="modal modal-full" id="profModal">
    <div class="modal-head">
      <h3 id="profModalTitle">Employee Profile</h3>
      <button class="mclose" onclick="closeProfileModal()">×</button>
    </div>
    <div class="modal-body" id="profModalBody"></div>
  </div>
</div>

<!-- ━━━ REVIEW CHECKLIST — dedicated overlay for the 21 tagged reviewers only.
     Replaces the old fixed-bottom banner (was blocking content on mobile). ━━━ -->
<div class="overlay" id="checklistOverlay" onclick="maybeCloseChecklist(event)">
  <div class="modal" id="checklistModal">
    <div class="modal-head">
      <h3 id="checklistModalTitle">📝 Review Checklist</h3>
      <button class="mclose" onclick="closeReviewChecklist()">×</button>
    </div>
    <div class="modal-body" id="checklistModalBody"></div>
  </div>
</div>


<script src="script.js"></script>

</body>
</html>
